<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit · Night schedule</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101215;color:#f3f4f5;font:15px "Segoe UI","Microsoft YaHei",sans-serif}.window{width:1000px;min-height:690px;margin:40px auto;background:#171a1f;border:1px solid #30343b;border-radius:18px;box-shadow:0 30px 90px #0008;overflow:hidden;display:grid;grid-template-columns:330px 1fr}.visual{padding:42px 34px;background:#14171b;border-right:1px solid #30343b}.orbit{height:236px;width:236px;margin:26px auto 30px;border-radius:50%;background:conic-gradient(from 0deg,#a6b8ff 0 67%,#343a46 67% 100%);position:relative;display:grid;place-items:center}.orbit:before{content:"";position:absolute;inset:9px;border-radius:50%;background:#171a1f}.clock{position:relative;text-align:center}.clock strong{display:block;font-size:54px;font-weight:550;letter-spacing:-2px;font-variant-numeric:tabular-nums}.clock small{color:#a7acb6;font-size:13px}.timeline{display:flex;justify-content:space-between;color:#a7acb6;font-size:12px}.visual h1{font-size:22px;font-weight:560;margin:0}.right{padding:42px 48px}.eyebrow{color:#99a0ad;font-size:13px}.right h2{font-size:28px;font-weight:550;letter-spacing:-.5px;margin:8px 0}.desc{color:#a6abb4;margin:0 0 28px}.tabs{display:flex;gap:8px;border-bottom:1px solid #32363e;padding-bottom:18px}.tabs button{background:transparent;color:#aeb4bf;border:1px solid #3b4049;border-radius:8px;padding:9px 14px}.tabs .on{color:#e8edff;background:#252b38;border-color:#6e7fa4}.times{display:grid;gap:16px;margin-top:22px}.time-row{display:grid;grid-template-columns:105px 1fr auto;align-items:center;padding:16px 18px;background:#1c2026;border:1px solid #30353e;border-radius:12px}.time-row h3{margin:0;font-size:15px;font-weight:500}.time-row p{margin:4px 0 0;color:#8f96a2;font-size:12px}.wheel{display:flex;align-items:center;gap:4px}.column{width:58px;height:116px;display:grid;grid-template-rows:1fr 1fr 1fr;text-align:center;align-items:center;border-block:1px solid #5c6780;color:#7e8694;font-variant-numeric:tabular-nums}.column b{font-size:28px;color:#edf0f6;font-weight:550}.colon{font-size:22px;color:#9ca4b2}.suffix{font-size:12px;color:#9fa7b6;margin-left:10px}.hint{margin-top:14px;color:#9ca3ae;font-size:13px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:28px}.actions button{height:42px;padding:0 18px;border-radius:9px;background:#22262d;color:#dce0e7;border:1px solid #3d424b}.actions .save{background:#c5d2ff;color:#111a2b;border:0;font-weight:650}
</style></head><body><div class="window"><aside class="visual"><h1>Orbit <span style="color:#818999">/</span> 作息</h1><div class="orbit"><div class="clock"><strong>08:30</strong><small>起床</small></div></div><div class="timeline"><span>起床 08:30</span><span>睡觉 23:00</span></div><p style="color:#afb5bf;line-height:1.65;margin-top:28px">这段时间会成为 Orbit 今天的刻度。睡觉时间跨过午夜时，仍按起床日归属。</p></aside><main class="right"><span class="eyebrow">欢迎使用 Orbit</span><h2>先定下你的日常节奏</h2><p class="desc">滚动小时或分钟列，也可用方向键逐格调整。</p><div class="tabs"><button class="on">固定作息</button><button>每日调整</button><button>周制</button></div><div class="times"><div class="time-row"><div><h3>起床</h3><p>新一天从这里开始</p></div><div class="wheel"><div class="column"><span>07</span><b>08</b><span>09</span></div><span class="colon">:</span><div class="column"><span>15</span><b>30</b><span>45</span></div><span class="suffix">24 小时</span></div><span>⌄</span></div><div class="time-row"><div><h3>睡觉</h3><p>今天的时间窗口结束</p></div><div class="wheel"><div class="column"><span>22</span><b>23</b><span>00</span></div><span class="colon">:</span><div class="column"><span>30</span><b>00</b><span>30</span></div><span class="suffix">24 小时</span></div><span>⌄</span></div></div><div class="hint">滚动小时或分钟列；按 ↑ ↓ 微调时间。</div><div class="actions"><button>返回</button><button class="save">保存作息</button></div></main></div><script>
function stepWheel(w,dir){const cols=[...w.parentElement.querySelectorAll('.wheel,.column')];const max=cols.indexOf(w)===0?24:60;const [prev,current,next]=w.children;const value=(Number(current.textContent)+dir+max)%max;prev.textContent=String((value+max-1)%max).padStart(2,'0');current.textContent=String(value).padStart(2,'0');next.textContent=String((value+1)%max).padStart(2,'0')}
const wheelSelector=document.querySelector('.column')?'.column':'.wheel';document.querySelectorAll(wheelSelector).forEach(w=>{w.tabIndex=0;w.setAttribute('role','spinbutton');w.setAttribute('aria-label',w.parentElement.querySelectorAll(wheelSelector).length===2?'时间数值':'小时或分钟');w.addEventListener('wheel',e=>{e.preventDefault();stepWheel(w,e.deltaY>0?1:-1)},{passive:false});w.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();stepWheel(w,e.key==='ArrowDown'?1:-1)}})});
document.querySelectorAll('.mode button,.tabs button').forEach(b=>b.addEventListener('click',()=>{const group=b.parentElement;group.querySelectorAll('button').forEach(x=>x.classList.remove('sel','on','selected'));b.classList.add(group.classList.contains('tabs')?'on':(group.classList.contains('mode')&&b.textContent.includes('固定')?'sel':'selected'))}));
</script></body></html>
