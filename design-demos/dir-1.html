<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit · Fluent settings</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#202124;font:15px "Segoe UI","Microsoft YaHei",sans-serif}.window{width:1000px;min-height:690px;margin:40px auto;background:#fafafa;border:1px solid #d8dce2;border-radius:14px;box-shadow:0 24px 70px #1d26351c;display:grid;grid-template-columns:220px 1fr;overflow:hidden}.nav{background:#f6f7f8;border-right:1px solid #e4e6e9;padding:28px 16px}.brand{font-size:20px;font-weight:650;margin:2px 10px 32px}.nav div{padding:11px 12px;border-radius:7px;color:#5d626b;margin:4px 0}.nav .active{background:#e8edf7;color:#214b91;font-weight:600}.main{padding:42px 54px}.eyebrow{color:#69717e;font-size:13px}.main h1{font-size:28px;letter-spacing:-.6px;margin:8px 0}.sub{color:#656b75;margin:0 0 30px}.section{border-top:1px solid #e2e4e8;padding:22px 0;display:grid;grid-template-columns:220px 1fr;gap:30px}.section h2{font-size:16px;margin:0 0 5px}.section p{font-size:13px;color:#737985;margin:0;line-height:1.5}.wheelbox{display:flex;gap:14px;align-items:center}.wheel{width:90px;height:142px;border-block:1px solid #aab7ca;display:grid;grid-template-rows:1fr 1fr 1fr;text-align:center;align-items:center;color:#9aa0a9;font-variant-numeric:tabular-nums;overflow:hidden}.wheel b{font-size:30px;color:#1d2d48;font-weight:600}.colon{font-size:24px;color:#8892a2}.wheel small{font-size:16px}.pair{display:flex;gap:28px;align-items:center}.pair label{font-size:13px;color:#606671;display:block;margin-bottom:8px}.mode{display:flex;gap:8px}.mode button{border:1px solid #d4d8df;background:#fff;padding:9px 16px;border-radius:7px;color:#4e5560}.mode .sel{background:#e9f0fd;border-color:#9ab5e3;color:#214d91}.footer{display:flex;justify-content:flex-end;gap:10px;margin-top:28px}.footer button{height:40px;padding:0 18px;border-radius:7px;border:1px solid #d3d7df;background:white;color:#333}.footer .primary{background:#2458a6;color:white;border-color:#2458a6}.note{font-size:12px;color:#737985;margin-top:8px}
</style></head><body><div class="window"><aside class="nav"><div class="brand">◉ Orbit</div><div class="active">作息</div><div>外观</div><div>提醒</div><div>关于</div></aside><main class="main"><span class="eyebrow">初始设置 · 1 / 1</span><h1>你的作息</h1><p class="sub">设定起床与睡觉时间，Orbit 会把今天的剩余时间显示在桌面上。</p><div class="section"><div><h2>作息方式</h2><p>选择一套规则，之后可以随时更改。</p></div><div class="mode"><button class="sel">固定</button><button>每日</button><button>工作日 / 周末</button></div></div><div class="section"><div><h2>每天使用的时间</h2><p>滚动数字或使用键盘调整。24 小时制。</p></div><div class="pair"><div><label>起床</label><div class="wheelbox"><div class="wheel"><small>07</small><b>08</b><small>09</small></div><span class="colon">:</span><div class="wheel"><small>00</small><b>30</b><small>00</small></div></div></div><div><label>睡觉</label><div class="wheelbox"><div class="wheel"><small>22</small><b>23</b><small>00</small></div><span class="colon">:</span><div class="wheel"><small>30</small><b>00</b><small>30</small></div></div></div></div></div><div class="note">工作日 / 周末会分别显示两组时间。每日模式默认沿用上一次作息。</div><div class="footer"><button>取消</button><button class="primary">开始使用</button></div></main></div>
<script>
function stepWheel(w,dir){const cols=[...w.parentElement.querySelectorAll('.wheel,.column')];const max=cols.indexOf(w)===0?24:60;const [prev,current,next]=w.children;const value=(Number(current.textContent)+dir+max)%max;prev.textContent=String((value+max-1)%max).padStart(2,'0');current.textContent=String(value).padStart(2,'0');next.textContent=String((value+1)%max).padStart(2,'0')}
const wheelSelector=document.querySelector('.column')?'.column':'.wheel';document.querySelectorAll(wheelSelector).forEach(w=>{w.tabIndex=0;w.setAttribute('role','spinbutton');w.setAttribute('aria-label',w.parentElement.querySelectorAll(wheelSelector).length===2?'时间数值':'小时或分钟');w.addEventListener('wheel',e=>{e.preventDefault();stepWheel(w,e.deltaY>0?1:-1)},{passive:false});w.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();stepWheel(w,e.key==='ArrowDown'?1:-1)}})});
document.querySelectorAll('.mode button,.tabs button').forEach(b=>b.addEventListener('click',()=>{const group=b.parentElement;group.querySelectorAll('button').forEach(x=>x.classList.remove('sel','on','selected'));b.classList.add(group.classList.contains('tabs')?'on':(group.classList.contains('mode')&&b.textContent.includes('固定')?'sel':'selected'))}));
</script></body></html>
