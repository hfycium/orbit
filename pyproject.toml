[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orbit"
version = "0.1.0"
description = "桌面悬浮球，边缘那一圈告诉你今天还剩多少"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
orbit = "orbit.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
